apiVersion: v1
kind: ConfigMap
metadata:
  name: financial-rag
  namespace: financial-rag
data:
  APP_ENV: prod
  LOG_LEVEL: INFO
  RETRIEVAL_BACKEND: postgres
  RAG_TOP_K: "4"
  RAG_DEDUPE_PAGES: "true"
  EMBEDDING_MODEL: /opt/embedding-model
  EMBEDDING_DIMENSION: "384"
  DB_POOL_MIN_SIZE: "1"
  DB_POOL_MAX_SIZE: "10"
  METRICS_ENABLED: "true"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
